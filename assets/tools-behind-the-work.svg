<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">The tools behind the work — Nalla Rithwik</title>
<desc id="desc">A unified dark navy technology spectrum card listing programming, frontend, backend, AI and data, databases, security, and developer tools.</desc>
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#8b5cf6"/><stop offset="1" stop-color="#10b981"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .label{font:700 15px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;fill:#22d3ee}
    .title{font:600 35px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#f8fafc}
    .sub{font:14px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#94a3b8;letter-spacing:1px}
    .group{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#e2e8f0;letter-spacing:1px}
    .item{font:15px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#cbd5e1}
    .tag{fill:#101f35;stroke:#29415e;stroke-width:1}
    .dot{fill:#22d3ee}
  </style>
</defs>
<rect width="1200" height="1040" rx="26" fill="#070d19"/>
<rect x="2" y="2" width="1196" height="1036" rx="24" fill="none" stroke="url(#border)" stroke-width="3"/>
